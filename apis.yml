name: Laurentian Bank of Canada
kind: company
description: >-
  Laurentian Bank of Canada (Banque Laurentienne du Canada) is a
  Montreal-headquartered Schedule I chartered bank, founded in 1846 as the
  Montreal City and District Savings Bank and listed on the Toronto Stock
  Exchange as LB. With roughly CA$47 billion in assets, about 3,000 employees,
  and approximately 1.5 million clients, it serves personal, commercial, and
  capital-markets customers - concentrated in Quebec with commercial offices
  across Canada - through subsidiaries including B2B Bank, Laurentian Bank
  Securities, and LBC Capital. The bank operates no public developer portal and
  exposes no first-party or FDX-style data-access API; consumer data access is
  aggregator-mediated today (screen-scraping via providers such as Flinks and
  Plaid), and Canada's federal Consumer-Driven Banking framework remains
  legislated but not yet operational, so participation is voluntary. In December
  2025 the bank announced a proposed sale to Fairstone Bank of Canada, with
  National Bank of Canada acquiring its retail operations.
